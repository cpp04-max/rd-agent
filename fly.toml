# Fly.io configuration for the RD-Agent web app
# App name/region below match `flyctl launch --name rd-agent-cpp --region lax`
app = "rd-agent-cpp"
primary_region = "lax"

[build]

[http_service]
  internal_port = 19899
  force_https = true
  # keep the machine up: RD-Agent scenarios are long-running background loops
  auto_stop_machines = false
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "60s"
    method = "GET"
    path = "/test"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
