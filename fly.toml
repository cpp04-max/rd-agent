# fly.toml app configuration file generated for rd-agent on 2026-08-07T14:46:02Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'rd-agent'
primary_region = 'lax'

[build]

[deploy]
  strategy = 'rolling'
  # RD-Agent can still need time after the Machine starts (volume attach, imports,
  # qlib initialization). Keep flyctl waiting long enough for health to settle.
  wait_timeout = '15m'

[http_service]
  internal_port = 19899
  force_https = true
  auto_stop_machines = 'off'
  # ACTIVE + COLD SPARE pattern: this app is stateful per machine (running tasks in
  # process memory; invites/traces/qlib data on that machine's own volume), so exactly
  # ONE machine must serve at a time. Keep the second machine STOPPED as a spare and
  # stop it again after every deploy. min_machines_running=1 lets Fly revive the active
  # machine if it dies, without starting the spare.
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    # The app loads trace history from the /data volume at boot; on a large trace
    # folder that can exceed 60s, which aborts rolling deploys. Give it 3 minutes.
    grace_period = '1m0s'
    method = 'GET'
    path = '/test'

[env]
  # Persist invites + run history on the rdagentdata volume
  INVITE_STORE = "/data/invites.json"
  UI_TRACE_FOLDER = "/data/traces"
  RDAGENT_QLIB_UNIVERSE = "csi300"
  # Bound CPU model training so one model can't eat the whole 6h loop timer
  # (LLM-proposed n_epochs defaults to 100; ~minutes/epoch on CPU). Tunable.
  # Fully unattended runs: answer every user interaction with sensible defaults
  # (default instruction, current base features, unmodified hypothesis/feedback).
  # Set to "false" (or remove) to get the interactive dialogs back.
  RDAGENT_AUTO_SKIP_INTERACTION = "true"
  RDAGENT_MAX_EPOCHS = "30"
  # P49: time-budget guard is action-aware. Factor iterations are usually much
  # faster than model training, so don't apply the old blanket 1-hour threshold.
  RDAGENT_MIN_FACTOR_LOOP_SECONDS = "1800"
  RDAGENT_MIN_MODEL_LOOP_SECONDS = "3600"
  # Persist CoSTEER knowledge across runs/deployments on the /data volume so
  # later loops reuse learned implementation knowledge instead of re-evolving.
  FACTOR_CoSTEER_knowledge_base_path = "/data/costeer/factor_kb.pkl"
  FACTOR_CoSTEER_new_knowledge_base_path = "/data/costeer/factor_kb.pkl"
  MODEL_CoSTEER_knowledge_base_path = "/data/costeer/model_kb.pkl"
  MODEL_CoSTEER_new_knowledge_base_path = "/data/costeer/model_kb.pkl"

# NOTE: keep exactly ONE machine for this app. A Fly volume attaches to a single
# machine; a second machine can never mount /data and will fail its health checks,
# aborting rolling deploys. If you ever see two machines, destroy the extra one
# (flyctl machine list / flyctl machine destroy <id>) or `flyctl scale count 1`.
[mounts]
  source = "rdagentdata"
  destination = "/data"

[[vm]]
  # TimeSeries GRU + CSI300 backtest can hold the train/valid/test tensors and
  # Qlib exchange/backtest state at the same time. The previous 4 GB machine was
  # observed being killed during backtest after successful prediction generation.
  # Keep CPU unchanged but give the process enough headroom to avoid the OOM cliff.
  # No GPU is needed - all LLM inference is remote (DashScope) and training is CPU.
  cpu_kind = 'performance'
  cpus = 2
  memory_mb = 8192
