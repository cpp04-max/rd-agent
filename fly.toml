app = "rd-agent"
primary_region = "lax"

[build]

[http_service]
  internal_port = 19899
  force_https = true
  # RD-Agent scenarios are long-running background processes — never auto-stop
  auto_stop_machines = false
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "60s"
    method = "GET"
    path = "/test"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
