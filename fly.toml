# fly.toml app configuration file generated for rd-agent on 2026-08-07T14:46:02Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'rd-agent'
primary_region = 'lax'

[build]

[http_service]
  internal_port = 19899
  force_https = true
  auto_stop_machines = 'off'
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '1m0s'
    method = 'GET'
    path = '/test'

[env]
  # Persist invites + run history on the rdagentdata volume
  INVITE_STORE = "/data/invites.json"
  UI_TRACE_FOLDER = "/data/traces"
  RDAGENT_QLIB_UNIVERSE = "csi300"

[mounts]
  source = "rdagentdata"
  destination = "/data"

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
