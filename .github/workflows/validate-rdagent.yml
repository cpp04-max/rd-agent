name: Validate RD-Agent image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  patch-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment repo
        uses: actions/checkout@v4

      - name: Fetch pinned upstream
        shell: bash
        run: |
          set -euxo pipefail
          sudo mkdir -p /src
          sudo chown "$USER":"$USER" /src
          git init -q /src
          git -C /src remote add origin https://github.com/microsoft/RD-Agent.git
          git -C /src fetch -q --depth 1 origin 6762f84f9bc0f5c6486c50a00e128a57ac6c3683
          git -C /src checkout -q FETCH_HEAD

      - name: Apply backend patches and regressions
        shell: bash
        run: |
          set -euxo pipefail
          python3 web-extras/patch-rdagent.py /src
          python3 web-extras/validate-backend-regressions.py /src

      - name: Apply frontend patches and regressions
        shell: bash
        run: |
          set -euxo pipefail
          cp web-extras/patch-frontend.js /tmp/patch-frontend.js
          cp web-extras/patch-history-p56.js /tmp/patch-history-p56.js
          cp web-extras/patch-route-p57.js /tmp/patch-route-p57.js
          cp web-extras/validate-frontend-regressions.js /tmp/validate-frontend-regressions.js
          cd /src
          node /tmp/patch-frontend.js
          node /tmp/validate-frontend-regressions.js

  docker-build:
    runs-on: ubuntu-latest
    needs: patch-smoke
    steps:
      - name: Checkout deployment repo
        uses: actions/checkout@v4
      - name: Build production image
        shell: bash
        run: |
          set -euxo pipefail
          # Docker Hub rate-limits hosted CI runners. Use the public ECR mirror only
          # for CI source resolution; the production Dockerfile itself is unchanged.
          sed \
            -e 's|FROM node:22-alpine AS frontend|FROM public.ecr.aws/docker/library/node:22-alpine AS frontend|' \
            -e 's|FROM python:3.10-slim|FROM public.ecr.aws/docker/library/python:3.10-slim|' \
            Dockerfile > Dockerfile.ci
          docker build --progress=plain -f Dockerfile.ci -t rd-agent-validation .
